name: daily-collect

on:
  schedule:
    - cron: "0 20 * * *"  # 매일 한국시간 오전 5시 (UTC 전날 20시)
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      cats:
        description: "시험용: 수집할 카테고리 (예: 한우암소 / 비우면 전부, 여러 개는 ; 로 구분)"
        type: string
        default: ""
      parts:
        description: "시험용: 수집할 부위 (예: 안심;등심 / 비우면 전부)"
        type: string
        default: ""
      quick:
        description: "빠른 시험 (수집을 건너뛰고 화면/비밀번호만 만들기)"
        type: boolean
        default: false

env:
  TZ: Asia/Seoul   # 날짜를 한국 기준으로 기록

permissions:
  contents: write
  pages: write

jobs:
  # 1) 이번에 수집할 카테고리 목록 정하기
  plan:
    runs-on: ubuntu-latest
    outputs:
      cats: ${{ steps.p.outputs.cats }}
    steps:
      - id: p
        env:
          IN_CATS: ${{ github.event.inputs.cats }}
          QUICK: ${{ github.event.inputs.quick }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          ALL = ["한우거세","한우암소","육우거세","육우암소","국내산 돈육","수입냉장우육","수입냉동우육","수입냉장돈육","수입냉동돈육","계육","양육","염소","세절육"]
          if os.environ.get("QUICK") == "true":
              cats = []
          elif os.environ.get("IN_CATS", "").strip():
              cats = [c.strip() for c in os.environ["IN_CATS"].split(";") if c.strip()]
          else:
              cats = ALL
          print("cats=" + json.dumps(cats, ensure_ascii=False))
          EOF

  # 2) 카테고리마다 따로, 동시에 수집 (한 번에 최대 4개씩)
  collect:
    needs: plan
    if: ${{ needs.plan.outputs.cats != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cat: ${{ fromJSON(needs.plan.outputs.cats) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare folders
        run: |
          mkdir -p _src
          for f in latest.json history.json; do
            if [ -f "$f" ] && [ ! -f "_src/$f" ]; then cp "$f" "_src/$f"; fi
          done
      - name: Install
        run: |
          pip install playwright beautifulsoup4 lxml
          playwright install --with-deps chromium
      - name: Collect ${{ matrix.cat }}
        working-directory: _src
        env:
          CAT: ${{ matrix.cat }}
          IN_PARTS: ${{ github.event.inputs.parts }}
        run: |
          args=(--cat "$CAT")
          if [ -n "$IN_PARTS" ]; then args+=(--parts "$IN_PARTS"); fi
          python ../ekcm_collector.py "${args[@]}" || echo "수집 중 오류 (받은 만큼은 저장)"
          mkdir -p ../out_part
          cp latest.json ../out_part/latest.json 2>/dev/null || echo "[]" > ../out_part/latest.json
          printf '%s' "$CAT" > ../out_part/cat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ strategy.job-index }}
          path: out_part/
          retention-days: 3

  # 3) 결과 합치기 → 화면 만들기 → 비밀번호 걸기 → 저장
  publish:
    needs: [plan, collect]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check password secret
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "SITE_PASSWORD 비밀값이 없어요. Settings > Secrets and variables > Actions 에서 먼저 추가해 주세요."
            exit 1
          fi

      - name: Prepare folders (first run moves data files)
        run: |
          mkdir -p _src
          for f in latest.json history.json; do
            if [ -f "$f" ]; then git mv "$f" "_src/$f"; fi
          done
          if [ ! -f _src/app.html ]; then cp index.html _src/app.html; fi

      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.cats != '[]' }}
        continue-on-error: true
        with:
          pattern: part-*
          path: parts

      - name: Merge results
        run: python merge.py parts

      - name: Build password-protected page
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python build.py
          npx -y staticrypt@3 plain.html -p "$SITE_PASSWORD" --short --remember 30 -d out \
            --template-title "동원 금천미트 도매 단가표" \
            --template-instructions "비밀번호를 입력해 주세요" \
            --template-button "열기" \
            --template-placeholder "비밀번호" \
            --template-error "비밀번호가 맞지 않아요"
          test -s out/plain.html
          cp out/plain.html index.html
          if [ -f pwa_inject.py ]; then python pwa_inject.py index.html; fi

      - name: Save results
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add _src/latest.json _src/history.json _src/app.html index.html
          if [ -f version.json ]; then git add version.json; fi
          git add -u
          git commit -m "daily update $(date +%F)" || echo "no changes"
          git pull --rebase
          git push

      - name: Refresh site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
