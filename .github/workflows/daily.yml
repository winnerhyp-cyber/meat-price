name: daily-collect

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 한국시간 오전 9시 (UTC 0시)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright beautifulsoup4 lxml
          playwright install --with-deps chromium
      - name: Collect
        run: python ekcm_collector.py
      - name: Save results
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest.json history.json
          git commit -m "daily update $(date +%F)" || echo "no changes"
          git pull --rebase
          git push
