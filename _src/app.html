<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b3261e">
<title>동원 금천미트 도매 단가표</title>
<style>
:root{
  --bg:#f6f4f1; --card:#fff; --ink:#1d1b1a; --sub:#6b6560; --line:#e6e1db;
  --red:#b3261e; --blue:#1f5fbf; --up:#c62828; --down:#1565c0; --warn:#b26a00; --chip:#efe9e2;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161413; --card:#201d1c; --ink:#f2eeea; --sub:#a39b94; --line:#33302e;
    --red:#ff8a80; --blue:#7fb2ff; --up:#ff8a80; --down:#7fb2ff; --warn:#ffb74d; --chip:#2b2725}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0}
.meta{color:var(--sub);font-size:13px;margin-top:2px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav div{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--sub);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=search]{flex:1;min-width:140px}
.tablewrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);width:fit-content;max-width:100%}
table{border-collapse:collapse;width:auto;min-width:0;background:var(--card)}
th,td{padding:7px 14px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600;font-size:13.5px;min-width:6em;max-width:8.5em;white-space:normal;line-height:1.25}
thead th{background:var(--chip);font-size:13px}
tr.grp td{background:var(--chip);color:var(--sub);font-size:12px;font-weight:700;text-align:left}
.rng{font-variant-numeric:tabular-nums}
.lo{font-weight:700}
.l{position:relative;width:max-content;margin:0 auto;display:grid;grid-template-columns:1em 4.9em 3.9em;column-gap:8px;align-items:baseline;justify-content:center;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
.l.nl{grid-template-columns:4.9em 3.9em;column-gap:8px}
.l .d{position:absolute;left:100%;top:0;margin-left:-2px;white-space:nowrap}
.l .t{font-size:10px;color:var(--sub);text-align:center}
.l b{font-weight:700;text-align:right}
.l em{font-style:normal;font-size:10.5px;color:var(--sub);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l.hi b{font-weight:500}
.th-u{display:block;font-size:10px;color:var(--sub);font-weight:400}
.n{display:none}
.thin .rng{color:var(--sub)}
.thin .l:last-child::after{content:"※";color:var(--warn);font-size:10px;position:absolute;left:100%;top:0;margin-left:2px}
.d{font-size:11px;margin-left:4px}
.up{color:var(--up)} .down{color:var(--down)}
.note{color:var(--sub);font-size:12.5px;margin:8px 2px}
.empty{color:var(--sub);padding:28px 8px;text-align:center}
.bars .row{display:grid;grid-template-columns:110px 1fr 76px;gap:8px;align-items:center;padding:4px 0;font-size:13.5px}
.bars .bar{height:14px;border-radius:7px;background:var(--red);opacity:.85}
.bars.hi .bar{background:var(--blue)}
.bars .v{text-align:right;font-variant-numeric:tabular-nums}
.bars .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border:0}
svg text{fill:var(--sub);font-size:11px}
.legend{font-size:12.5px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}
@media(max-width:560px){.l{grid-template-columns:.9em 4.4em 3.3em!important;column-gap:5px}.l.nl{grid-template-columns:4.4em 3.3em!important}th,td{padding:6px 4px}.l{column-gap:3px}th:first-child,td:first-child{font-size:12.5px;min-width:4.6em;max-width:6.2em}.bars .row{grid-template-columns:84px 1fr 68px}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--sub);padding:8px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.st{cursor:pointer;color:var(--sub);margin-right:2px}.st.on{color:#e0a100}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cdh{margin-bottom:4px}
.cdr{display:grid;grid-template-columns:34px 1fr;gap:0 8px;padding:3px 0;border-top:1px solid var(--line);font-size:13.5px}
.cdr .g{color:var(--sub);font-weight:700;grid-row:span 2}
.cdr .v{font-variant-numeric:tabular-nums}.cdr .bb{font-size:11px;color:var(--sub)}
.cdr.thin .v{color:var(--sub)}
.tl td,.tl th{padding:11px 22px}
.tl th:first-child,.tl td:first-child{min-width:11em;max-width:none;white-space:nowrap;font-size:14px}
.tl .l{column-gap:10px;font-size:14px}
.tl td:last-child{color:var(--sub)}
@media(max-width:560px){.tl td,.tl th{padding:10px 6px}.tl th:first-child,.tl td:first-child{min-width:0;white-space:normal;font-size:12.5px}.tl .l{font-size:13px}}
th:first-child,td:first-child{white-space:nowrap;min-width:9em;max-width:none}
td.wrapok{white-space:normal!important;max-width:11em!important}
tr.grp td:not(:first-child){text-align:center}
@media(max-width:560px){th:first-child,td:first-child{min-width:5.2em;max-width:6.5em;white-space:normal;word-break:keep-all;font-size:12.5px}.tl th:first-child,.tl td:first-child{min-width:0}}
.l.lb{grid-template-columns:6em 3.9em;column-gap:8px}
.l.lb .t{margin-right:5px}
@media(max-width:560px){.l.lb{grid-template-columns:5.3em 3.3em!important;column-gap:5px}}
@media(max-width:560px){
 th:first-child,td:first-child{white-space:nowrap!important;min-width:0!important;max-width:none!important;font-size:12px;word-break:keep-all}
 td.wrapm{white-space:normal!important;max-width:7.2em!important}
 .st{margin-right:0}
}
.gu{font-size:10px;font-weight:400;color:var(--sub);margin-left:2px}
.cats{margin:10px 0 0;flex-wrap:wrap;width:fit-content;max-width:100%}
.cats button{padding:7px 14px}
th:first-child,td:first-child{position:sticky;left:0;z-index:3;background:var(--card);box-shadow:1px 0 0 var(--line)}
thead th:first-child{background:var(--chip);z-index:4}
tr.grp td:first-child{background:var(--chip)}
.tablewrap table{position:relative}
.l .d{font-size:10.5px;margin-left:3px}
.tablewrap td:not(:first-child){padding-right:40px}
.tablewrap td:not(:first-child):last-child{padding-right:44px}
.so{color:var(--sub);font-size:12px;text-align:center;font-weight:600}
.tablewrap td.so{padding-right:4px}
.l .bx i{font-style:normal;font-size:9.5px;color:var(--sub);opacity:.85}
.l.lb:has(.bx){grid-template-columns:6em 10em}
.l.nl:has(.bx){grid-template-columns:4.9em 9em}
@media(max-width:560px){.l.lb:has(.bx){grid-template-columns:5.3em 8.6em!important}.l.nl:has(.bx){grid-template-columns:4.4em 8em!important}}
.vis{text-align:center;color:var(--sub);font-size:13px;margin:22px 0 6px}
.vis b{color:var(--ink,#222);font-size:15px;margin:0 2px}
footer.ft{text-align:center;color:var(--sub);font-size:12.5px;line-height:1.7;padding:6px 14px 30px}
footer.ft .cp{display:block;margin-top:4px;font-size:14px;font-weight:700;color:var(--ink,#222)}
.cm{max-width:760px;margin:26px auto 0;padding:0 14px}
.cm h3{font-size:15px;margin:0 0 8px}
.cm .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cm .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:8px;flex-wrap:wrap}
.cm button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 12px;cursor:pointer}
.cm button.pri{background:#1c1c1c;color:#fff;border-color:#1c1c1c}
.cm textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;min-height:62px;background:#fff}
.cm .ci{padding:9px 2px;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.cm .ci:first-child{border-top:0}
.cm .ci .m{font-size:12px;color:var(--sub);margin-bottom:2px}
.cm .ci .m b{color:var(--ink,#222);font-size:13px}
.cm .ci .tx{white-space:pre-wrap;word-break:break-word}
.cm .warn{background:#fff4e0;border:1px solid #f0d49a;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px;line-height:1.5}
.cm .hint{font-size:12px;color:var(--sub);margin-top:6px}
.all-h{font-size:16px;margin:10px 2px 6px}
.sec{margin:0 0 16px}
.sec-h{font-size:14px;margin:12px 2px 6px;padding-left:8px;border-left:4px solid #1c1c1c}
.sec-h small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.prt{font:inherit;font-size:13px;border:1px solid #1c1c1c;background:#1c1c1c;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
.allv.sum .tl td{padding-top:4px;padding-bottom:4px}
@media print{
  @page{size:A4;margin:8mm}
  html,body{background:#fff!important}
  #cats,nav,.alltools,#nt,.cm,.vis,.st,.note{display:none!important}
  header{padding:0 0 4px!important;position:static!important}
  header h1{font-size:15px!important;margin:0!important}
  .meta{font-size:10px!important}
  .all-h{font-size:13px;margin:2px 0 4px}
  .tablewrap{overflow:visible!important;border:0!important;box-shadow:none!important;border-radius:0!important}
  th:first-child,td:first-child{position:static!important;box-shadow:none!important}
  table{font-size:9px!important}
  .sec{margin:0 0 6px}
  .sec-h{font-size:11px;margin:6px 0 3px;break-after:avoid}
  tr{break-inside:avoid}
  .allv.sum{column-count:2;column-gap:6mm}
  .allv.sum .sec{break-inside:auto}
  .allv.sum table{width:100%!important;min-width:0!important;table-layout:fixed}
  .allv.sum th,.allv.sum td{padding:2px 3px!important}
  .allv.sum th:first-child,.allv.sum td:first-child{width:27%}
  .allv.sum .l.nl,.allv.sum .l.nl:has(.bx){grid-template-columns:3.6em 1fr!important;column-gap:3px!important}
  .allv.sum .l em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-size:8.5px}
  .allv.sum .l b{font-size:9.5px}
  .allv.det{zoom:.56}
  footer.ft{font-size:9px;padding:6px 0 0}
  footer.ft .cp{font-size:10px}
}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand img{width:auto;display:block;position:relative;top:-5px}
.brand img.lk{height:30px}
.brand img.ld{height:28px}
@media(prefers-color-scheme:dark){.brand img{filter:brightness(1.45)}}
.brand span{white-space:nowrap}
@media print{
  .brand img.lk{height:20px!important;top:-3px}.brand img.ld{height:19px!important;top:-3px}
  .allv.sum td:first-child{white-space:normal!important;word-break:keep-all;overflow-wrap:anywhere;line-height:1.15}
  .allv.sum th:first-child,.allv.sum td:first-child{width:25%!important}
  .allv.sum .l,.allv.sum .l.nl,.allv.sum .l.nl:has(.bx){display:grid!important;grid-template-columns:3.7em minmax(0,1fr)!important;align-items:start}
  .allv.sum .l b{white-space:nowrap}
  .allv.sum .l,.allv.sum .l.nl{width:auto!important;max-width:100%!important;margin:0!important;justify-content:start!important}
  .allv.sum .l em{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:anywhere;line-height:1.15;min-width:0}
  .allv.sum .l em i{display:inline}
  .allv.sum td{vertical-align:top}
}
</style>
</head>

","min_grade":"1+B","max_kg":29000,"max_goods":"28619083","max_brand":"성신한우","max_grade":"1+A","min_all_kg":27800,"max_all_kg":29000},{"day":"2026-11-21","part":"사태","grade_f":"1","total":34,"min_kg":27300,"min_goods":"28607084","min_brand":"마장동한우","min_grade":"1C","max_kg":28500,"max_goods":"28619512","max_brand":"성신한우","max_grade":"1A","min_all_kg":27300,"max_all_kg":28500},{"day":"2026-11-21","part":"사태","grade_f":"2","total":24,"min_kg":28000,"min_goods":"28596712","min_brand":"금천한우","min_grade":"2A","max_kg":28000,"max_goods":"28596712","max_brand":"금천한우","max_grade":"2A","min_all_kg":28000,"max_all_kg":28000}];</script>
<section class="cm" id="cm" style="display:none"><h3>💬 댓글</h3><div class="box"><div id="cmAuth"></div><div id="cmForm"></div></div><div class="box" id="cmList" style="margin-top:8px"></div></section>
<div class="vis" id="vis" style="display:none">👀 오늘 방문 <b id="vd">-</b>명 · 전체 방문 <b id="vt">-</b>명</div>

</footer>
<script>
const won=n=>n==null?"-":Number(n).toLocaleString("ko-KR");
const $=s=>document.querySelector(s);
let ALL=[], DAYS=[], TODAY="", tab="today";
const BONE=new Set(["우족","사골","꼬리반골","알꼬리","잡뼈","잡육","도가니","스지","마구리","막내장"]);
const GRP_ORDER=["냉장","냉동","뼈·부산물"];
const BONE2=["사골","스지","도가니","꼬리","목뼈","학본","곱창","홍창","깐양","대동맥","등뼈","막창","미니족","장족","오소리감투","학"];
const grp=p=>CAT.startsWith("수입냉동")?(BONE2.some(x=>p.startsWith(x))?"뼈·부산물":"냉동"):((p.startsWith("냉동")||p==="차돌박이")?"냉동":(BONE.has(p)?"뼈·부산물":"냉장"));
const CAT_ORDER=["한우거세","한우암소","육우거세","육우암소","국내산 돈육","수입냉장우육","수입냉동우육","수입냉장돈육","수입냉동돈육"];
const GRADE_ORDER=["1++","1+","1","2","3","등외","PR","CAB","CH(SRA)","CH","CH(SS)","SEL","GF","PSA","S","A","YP/GF"];
let CAT="한우거세", CATS=[];
let GRADES=["1++","1+","1","2","3"];
const gradesOf=c=>{const s=new Set(ALL.filter(r=>r.category===c&&!r.grade_f.startsWith("국가:")).map(r=>r.grade_f));return [...GRADE_ORDER.filter(x=>s.has(x)),...[...s].filter(x=>!GRADE_ORDER.includes(x)).sort()]};
const nm=p=>p==="차돌박이"?"차돌박이(냉동)":p;

async function load(){
  let latest=[], hist=[];
  try{ latest=await (await fetch("latest.json",{cache:"no-store"})).json(); }catch(e){}
  if(!latest.length && window.EMBED) latest=window.EMBED;
  if(!hist.length && window.EMBED_HIST) hist=window.EMBED_HIST;
  try{ hist=await (await fetch("history.json",{cache:"no-store"})).json(); }catch(e){}
  const map=new Map();
  [...hist,...latest].forEach(r=>{r.category=r.category||"한우거세";map.set(r.day+"|"+r.category+"|"+r.part+"|"+r.grade_f,r)});
  const HIDE=["수입냉장우육(미국)","수입냉장우육(호주)","수입냉동우육(미국)","수입냉동우육(호주)","국내산돈육"];
  ALL=[...map.values()].filter(r=>r.total>0&&!HIDE.includes(r.category));
  const present=[...new Set(ALL.map(r=>r.category))];
  CATS=[...CAT_ORDER.filter(c=>present.includes(c)),...present.filter(c=>!CAT_ORDER.includes(c))];
  if(!CATS.includes(CAT)) CAT=CATS[0]||CAT;
  GRADES=gradesOf(CAT);
  DAYS=[...new Set(ALL.map(r=>r.day))].sort();
  setToday();
  render();
}
const rowsOf=d=>ALL.filter(r=>r.day===d&&r.category===CAT);
const get=(d,p,g)=>ALL.find(r=>r.day===d&&r.category===CAT&&r.part===p&&r.grade_f===g);
const catDays=c=>[...new Set(ALL.filter(r=>r.category===c).map(r=>r.day))].sort();
// 카테고리별 기준일: 일부 부위만 수집한 날(시험 실행 등)은 건너뛰고, 충분히 수집된 가장 최근 날을 씀
function catToday(c){const ds=catDays(c);let best=null,mx=0;
  for(const d of ds){const n=ALL.filter(r=>r.category===c&&r.day===d).length;if(mx===0||n>=0.6*mx)best=d;mx=Math.max(mx,n)}
  return best||ds[ds.length-1]||""}
function setToday(){TODAY=catToday(CAT);const n=catDays(CAT).filter(d=>d<=TODAY).length;
  $("#meta").textContent = TODAY ? `기준일 ${TODAY} · 수집일수 ${n}일 · 명품 제외 · Kg당 원` : "데이터가 없습니다"}
const prevDay=()=>{const ds=catDays(CAT).filter(d=>d<TODAY);return ds.length?ds[ds.length-1]:null};
const PART_ORDER=["안심", "등심", "윗등심", "아랫등심", "채끝", "목심", "앞다리살", "앞다리살(앞다리+꾸리)", "꾸리살", "부채살", "우둔살", "홍두깨", "설도", "설도(삼각살 X)", "설깃", "삼각살", "양지머리,치마양지", "양지머리 외", "치마살", "차돌박이(냉장)", "업진살", "앞치마살,업진안살", "앞치마살", "업진안살", "사태", "갈비", "갈비살", "안창살", "갈비본살+갈비살치", "토시살", "늑간살", "토시,제비추리", "제비추리", "안창외2종", "차돌박이", "냉동목심", "냉동설깃", "냉동앞다리", "냉동설도", "냉동사태", "냉동우둔", "냉동양지머리,치마양지", "냉동갈비"];
const pidx=p=>{if(CAT!=="한우거세")return 0;const i=PART_ORDER.indexOf(p);return i<0?999:i};
let SEEN=new Set();
const seenPG=(p,g)=>SEEN.has(p+"|"+g);
const parts=()=>{const s=[];rowsOf(TODAY).forEach(r=>{if(!s.includes(r.part))s.push(r.part)});ALL.forEach(r=>{if(r.category===CAT&&r.day<TODAY&&!s.includes(r.part))s.push(r.part)});return s.sort((a,b)=>(GRP_ORDER.indexOf(grp(a))-GRP_ORDER.indexOf(grp(b)))||(pidx(a)-pidx(b)))};

function delta(cur,old){
  if(old==null||cur==null||cur===old) return "";
  const p=((cur-old)/old*100);
  return `<span class="d ${cur>old?'up':'down'}">${cur>old?'▲':'▼'}${Math.abs(p).toFixed(1)}%</span>`;
}

function favs(){try{return JSON.parse(localStorage.getItem("fav")||"[]")}catch(e){return[]}}
function toggleFav(p){try{const f=favs();const i=f.indexOf(p);i<0?f.push(p):f.splice(i,1);localStorage.setItem("fav",JSON.stringify(f))}catch(e){}}
let MODE="grid", LG="1++", LO="", SORT="part";
let ORIGS=[];
const sb=b=>b.replace(/한우$/,"").replace(/대한으로$/,"").replace(/\(.*\)$/,"");
const br=b=>b?`<em title="${b}">${sb(b)}</em>`:"";
const bx=(r,w)=>{const b=r[w+"_brand"],o=r[w+"_origin"],g=r[w+"_grade"];if(!b)return "";
  if(!o)return br(b);
  const x=[o,g].filter(Boolean).join("·");return `<em class="bx" title="${b} ${x}">${sb(b)} <i>${x}</i></em>`};
const fkey=p=>CAT+"|"+p;
const star=p=>`<span class="st ${favs().includes(fkey(p))?'on':''}" data-p="${fkey(p)}" title="즐겨찾기">${favs().includes(fkey(p))?'★':'☆'}</span>`;

function viewToday(){
  const pd=prevDay();
  ORIGS=[...new Set(ALL.filter(r=>r.category===CAT&&r.grade_f.startsWith("국가:")).map(r=>r.grade_f.slice(3)))];
  if(MODE==="origin"&&!ORIGS.length) MODE="grid";
  SEEN=new Set(ALL.filter(r=>r.category===CAT&&r.day<TODAY).map(r=>r.part+"|"+r.grade_f));
  $("#view").innerHTML=`<div class="tools">
    <div class="seg" id="seg"><button data-m="grid">가로 표</button><button data-m="list">등급별 목록</button><button data-m="card">카드</button>${ORIGS.length?`<button data-m="origin">원산지별</button>`:""}</div>
    <select id="lg" style="display:none">${GRADES.map(g=>`<option>${g}</option>`).join("")}</select>
    <select id="so" style="display:none"><option value="part">부위순</option><option value="asc">싼 순(최저가)</option><option value="desc">비싼 순(최저가)</option></select>
  </div><div class="tools"><input type="search" id="q" placeholder="부위 검색 (예: 안심, 갈비)">
    <select id="fz"><option value="">전체</option><option value="냉장">냉장</option><option value="냉동">냉동</option><option value="뼈·부산물">뼈·부산물</option></select>
    <label style="font-size:13px"><input type="checkbox" id="fv"> ★ 즐겨찾기만</label></div>
  <div id="out"></div>
  <div class="note" id="nt"></div>`;
  $("#lg").value=LG; $("#so").value=SORT;
  const filt=()=>{const q=$("#q").value.trim(),fz=$("#fz").value,fv=$("#fv").checked,f=favs();
    return parts().filter(p=>(!q||p.includes(q))&&(!fz||grp(p)===fz)&&(!fv||f.includes(fkey(p))))};
  const draw=()=>{
    document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x.dataset.m===MODE));
    const isL=MODE==="list"||MODE==="origin";
    if(isL){const opts=MODE==="origin"?ORIGS:GRADES, ov=$("#lg").value, cur=opts.includes(ov)?ov:(MODE==="origin"?LO:LG);
      $("#lg").innerHTML=opts.map(g=>`<option>${g}</option>`).join(""); $("#lg").value=opts.includes(cur)?cur:(opts[0]||"")}
    $("#lg").style.display=isL?"":"none"; $("#so").style.display=isL?"":"none";
    const ps=filt(); let out="";
    if(MODE==="grid"){
      let last="",rows="";
      ps.forEach(p=>{const g=grp(p);
        if(g!==last){rows+=`<tr class="grp"><td>${g}</td>${GRADES.map(x=>`<td>${x} <span class="gu">(원/Kg)</span></td>`).join("")}</tr>`;last=g}
        rows+=`<tr><td class="${p.length>12?'wrapok':''} ${p.length>9?'wrapm':''}">${star(p)} ${nm(p)}</td>`+GRADES.map(gr=>{
          const r=get(TODAY,p,gr); if(!r) return seenPG(p,gr)?`<td class="so">품절</td>`:`<td class="rng" style="color:var(--sub)">-</td>`;
          const o=pd?get(pd,p,gr):null;
          return `<td class="${r.total<=3?'thin':''}" title="${r.total}건"><div class="l lb"><b><span class="t">저</span>${won(r.min_kg)}</b>${delta(r.min_kg,o&&o.min_kg)}${bx(r,"min")}</div><div class="l lb hi"><b><span class="t">고</span>${won(r.max_kg)}</b>${bx(r,"max")}</div></td>`}).join("")+"</tr>"});
      out=`<div class="tablewrap"><table><thead><tr><th>부위</th>${GRADES.map(g=>`<th>${g}<span class="th-u">(원/Kg)</span></th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${GRADES.length+1}" class="empty">결과가 없어요</td></tr>`}</tbody></table></div>`;
      $("#nt").textContent="저=Kg당 최저가 · 고=Kg당 최고가 · 옆 글씨는 브랜드 · ※ 는 상품 3개 이하(참고용)"+(pd?" · ▲▼ 전일 대비 최저가":"");
    }else if(MODE==="list"||MODE==="origin"){
      const sel=$("#lg").value; if(MODE==="origin")LO=sel; else LG=sel; SORT=$("#so").value;
      const g=MODE==="origin"?"국가:"+sel:sel;
      let rs=ps.map(p=>get(TODAY,p,g)).filter(Boolean);
      const soldP=ps.filter(p=>!get(TODAY,p,g)&&seenPG(p,g));
      if(SORT==="asc") rs.sort((a,b)=>a.min_kg-b.min_kg); else if(SORT==="desc") rs.sort((a,b)=>b.min_kg-a.min_kg);
      out=`<div class="tablewrap"><table class="tl"><thead><tr><th>부위 (${MODE==="origin"?sel:g})</th><th>최저</th><th>최고</th><th>상품</th></tr></thead><tbody>`+
        (rs.map(r=>{const o=pd?get(pd,r.part,g):null;return `<tr class="${r.total<=3?'thin':''}"><td>${star(r.part)} ${nm(r.part)}</td><td><div class="l nl"><b>${won(r.min_kg)}</b>${delta(r.min_kg,o&&o.min_kg)}${bx(r,"min")}</div></td><td><div class="l nl hi"><b>${won(r.max_kg)}</b>${bx(r,"max")}</div></td><td style="color:var(--sub);font-size:12px">${r.total}건${r.total<=3?" ※":""}</td></tr>`}).join("")+soldP.map(p=>`<tr><td>${star(p)} ${nm(p)}</td><td colspan="3" class="so">품절</td></tr>`).join("")||`<tr><td colspan="4" class="empty">이 등급 데이터가 없어요</td></tr>`)+`</tbody></table></div>`;
      $("#nt").textContent="단위: 원/Kg · 등급을 고르고 정렬을 바꿔보세요. ※ 는 상품 3개 이하(참고용)";
    }else{
      out=`<div class="cards">`+(ps.map(p=>`<div class="cd"><div class="cdh">${star(p)} <b>${nm(p)}</b></div>`+GRADES.map(gr=>{
        const r=get(TODAY,p,gr); if(!r) return seenPG(p,gr)?`<div class="cdr"><span class="g">${gr}</span><span class="v so">품절</span></div>`:"";
        return `<div class="cdr ${r.total<=3?'thin':''}"><span class="g">${gr}</span><span class="v"><b>${won(r.min_kg)}</b> ~ ${won(r.max_kg)}</span><span class="bb">${r.min_brand||""}${r.min_brand&&r.max_brand&&r.min_brand!==r.max_brand?" / "+r.max_brand:""}</span></div>`}).join("")+`</div>`).join("")||`<div class="empty">결과가 없어요</div>`)+`</div>`;
      $("#nt").textContent="카드 한 장에 등급별 최저 ~ 최고 (원/Kg)와 브랜드";
    }
    $("#out").innerHTML=out;
  };
  $("#seg").onclick=e=>{const b=e.target.closest("button");if(b){MODE=b.dataset.m;draw()}};
  $("#out").onclick=e=>{const s=e.target.closest(".st");if(s){toggleFav(s.dataset.p);draw()}};
  ["q","fz","fv","lg","so"].forEach(i=>{$("#"+i).oninput=draw;$("#"+i).onchange=draw}); draw();
}

function viewCmp(){
  $("#view").innerHTML=`<div class="card"><div class="tools">

function line(series,days){
  const W=640,H=240,P={l:52,r:12,t:12,b:26};
  const vals=series.flatMap(s=>s.v).filter(v=>v!=null);
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*.15||hi*.05; lo-=pad;hi+=pad;
  const x=i=>P.l+(days.length===1?.5:i/(days.length-1))*(W-P.l-P.r);
  const y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${won(Math.round(v/100)*100)}</text>`}
  const step=Math.ceil(days.length/6);
  days.forEach((d,i)=>{if(i%step===0||i===days.length-1)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${d.slice(5)}</text>`});
  series.forEach(se=>{
    const pts=se.v.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${se.c}"/>`);
  });
  return s+"</svg>";
}
